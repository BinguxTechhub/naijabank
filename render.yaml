services:
    - type: web
    name: naijabank-auth
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn auth_service:app --host 0.0.0.0 --port $PORT
    - type: web
    name: naijabank-account
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn account_service:app --host 0.0.0.0 --port $PORT
    - type: web
    name: naijabank-transfer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn transfer_service:app --host 0.0.0.0 --port $PORT